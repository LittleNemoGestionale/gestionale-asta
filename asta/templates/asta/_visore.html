{# Visore della foto del modulo, accanto ai campi da compilare: ingrandisci, ruota, sposta. #}
<style>
  .con-foto { display:grid; gap:18px; align-items:start }
  .con-foto.attivo { grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) }
  .con-foto > * { min-width:0 }
  @media (max-width:900px){ .con-foto.attivo { grid-template-columns:1fr } }
  .visore { position:sticky; top:8px; border:1px solid var(--line); border-radius:10px; background:var(--soft); padding:8px }
  .visore .comandi { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:6px }
  .visore .comandi button { font:inherit; font-size:13px; padding:4px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer }
  .visore .area { height:min(78vh,900px); overflow:auto; background:#fff; border-radius:6px; cursor:grab }
  .visore img { display:block; transform-origin:top left; max-width:none }
  .miniature { display:flex; gap:6px; flex-wrap:wrap }
  .miniature button { padding:0; border:2px solid transparent; border-radius:6px; background:none; cursor:pointer }
  .miniature button.on { border-color:var(--accent) }
  .miniature img { width:56px; height:56px; object-fit:cover; border-radius:4px; display:block }
</style>
<script>
function Visore(aside) {
  const img = aside.querySelector("img"), area = aside.querySelector(".area");
  let zoom = 1, giro = 0;
  function disegna() {
    if (!img.naturalWidth) return;
    const larg = area.clientWidth - 4, base = larg / (giro % 180 ? img.naturalHeight : img.naturalWidth);
    const w = img.naturalWidth * base * zoom, h = img.naturalHeight * base * zoom;
    img.style.width = w + "px"; img.style.height = h + "px";
    const t = {0: "", 90: `translate(${h}px,0)`, 180: `translate(${w}px,${h}px)`, 270: `translate(0,${w}px)`}[giro];
    img.style.transform = `${t} rotate(${giro}deg)`;
    img.parentElement.style.height = (giro % 180 ? w : h) + "px";
    img.parentElement.style.width = (giro % 180 ? h : w) + "px";
  }
  aside.addEventListener("click", e => {
    const b = e.target.closest("button[data-v]"); if (!b) return;
    e.preventDefault();
    const v = b.dataset.v;
    if (v === "+") zoom = Math.min(zoom * 1.3, 6);
    if (v === "-") zoom = Math.max(zoom / 1.3, 0.5);
    if (v === "1") zoom = 1;
    if (v === "r") giro = (giro + 90) % 360;
    disegna();
  });
  let tira = null;  // trascina per spostarsi nella foto ingrandita
  area.addEventListener("pointerdown", e => { tira = {x: e.clientX, y: e.clientY, l: area.scrollLeft, t: area.scrollTop}; area.style.cursor = "grabbing"; });
  addEventListener("pointerup", () => { tira = null; area.style.cursor = "grab"; });
  area.addEventListener("pointermove", e => { if (tira) { area.scrollLeft = tira.l - (e.clientX - tira.x); area.scrollTop = tira.t - (e.clientY - tira.y); } });
  img.addEventListener("load", disegna);
  addEventListener("resize", disegna);
  return { mostra(src) { zoom = 1; giro = 0; img.src = src; } };
}
</script>
